syntax = "proto3";
package genesischain.genesischain.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "genesischain/genesischain/v1/params.proto";

option go_package = "genesis-chain/x/genesischain/types";

// GenesisState defines the genesischain module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
